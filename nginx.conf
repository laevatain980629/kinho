server {
    listen 80 default_server;
    server_name _;

    # pc-admin (管理后台) - 根路径
    root /opt/kinho/apps/pc-admin/dist;
    index index.html;

    # API 代理到 NestJS 后端
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # customer-h5 (客户H5)
    location /customer-h5/ {
        alias /opt/kinho/apps/customer-h5/dist/;
        try_files $uri $uri/ /customer-h5/index.html;
    }

    # mobile-web (移动Web)
    location /mobile-web/ {
        alias /opt/kinho/apps/mobile-web/dist/;
        try_files $uri $uri/ /mobile-web/index.html;
    }

    # pc-admin SPA 路由（根路径之外的都 fallback 到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
